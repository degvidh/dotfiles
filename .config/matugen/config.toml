[config]

[templates.ghostty]
input_path = '~/.config/matugen/templates/ghostty'
output_path = '~/.config/ghostty/themes/matugen-theme'
post_hook = 'gdbus call --session --dest com.mitchellh.ghostty --object-path /com/mitchellh/ghostty --method org.gtk.Actions.Activate "reload-config" "[]" "{}" >/dev/null 2>&1 || true'

[templates.qs_palette]
input_path = '~/.config/matugen/templates/qs-palette.json'
output_path = '~/.config/quickshell/palette.json'

[templates.strata]
input_path = '~/.config/matugen/templates/qs-matugen.toml'
output_path = '~/.config/strata/themes/qs-matugen.toml'

[templates.fish_colors]
input_path = '~/.config/matugen/templates/fish-colors.fish'
output_path = '~/.config/fish/functions/matugen_colors.fish'

[templates.fish_theme]
input_path = '~/.config/matugen/templates/fish-theme'
output_path = '~/.config/fish/themes/matugen.theme'

[templates.rofi]
input_path = '~/.config/matugen/templates/rofi.rasi'
output_path = '~/.config/rofi/matugen.rasi'

[templates.fastfetch]
input_path = '~/.config/matugen/templates/fastfetch.jsonc'
output_path = '~/.config/fastfetch/matugen.jsonc'

[templates.nvim]
input_path = '~/.config/matugen/templates/nvim-colors.json'
output_path = '~/.config/nvim/templates/nvim-colors.json'
post_hook = 'pkill -SIGUSR1 nvim || true'

[templates.hyprland]
input_path = '~/.config/matugen/templates/hyprland-colors.lua'
output_path = '~/.config/hypr/colors.lua'
post_hook = 'hyprctl reload >/dev/null 2>&1 || true'
