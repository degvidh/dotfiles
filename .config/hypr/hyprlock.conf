# Generated by lock-screen (clean style: blurred screenshot + centered stack).
general {
    hide_cursor = true
    no_fade_in = false
    no_fade_out = false
}

background {
    path = screenshot
    blur_passes = 4
    blur_size = 12
    brightness = 0.34
    vibrancy = 0.10
    noise = 0.015
    contrast = 0.85
}

label {
    text = $TIME
    font_family = JetBrains Mono Light
    font_size = 86
    color = rgba(222, 227, 229, 0.96)
    position = 0, -150
    halign = center
    valign = center
}

label {
    text = cmd[update:60000] date +"%A  ·  %B %d"
    font_family = JetBrains Mono
    font_size = 16
    color = rgba(191, 200, 202, 0.85)
    position = 0, -94
    halign = center
    valign = center
}

label {
    text = Welcome back, $USER
    font_family = JetBrains Mono
    font_size = 13
    color = rgba(191, 200, 202, 0.85)
    position = 0, 41
    halign = center
    valign = center
}

input-field {
    size = 340, 54
    outline_thickness = 1
    outer_color = rgba(166, 166, 166, 0.90)
    inner_color = rgba(14, 20, 21, 0.72)
    font_color = rgba(222, 227, 229, 1.00)
    font_family = JetBrains Mono
    placeholder_text = Password
    fade_on_empty = false
    rounding = 24
    position = 0, 95
    halign = center
    valign = center
}
